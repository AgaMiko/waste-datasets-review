<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
<clipPath id="t"><rect width="100" height="100" rx="6"/></clipPath>
<symbol id="bottle" viewBox="0 0 60 24"><rect x="0" y="3" width="42" height="18" rx="7" fill="#cfe5fb" stroke="#5b8fc7" stroke-width="1.4"/>
  <path d="M42 7 L50 9 L50 15 L42 17 Z" fill="#cfe5fb" stroke="#5b8fc7" stroke-width="1.4"/><rect x="50" y="8.5" width="7" height="7" rx="1.5" fill="#2563eb"/>
  <rect x="12" y="3.6" width="14" height="16.8" fill="#60a5fa" opacity="0.7"/></symbol>
<symbol id="can" viewBox="0 0 20 30"><rect x="1" y="3" width="18" height="25" rx="3" fill="#dc2626"/><ellipse cx="10" cy="4" rx="9" ry="3" fill="#cbd5e1" stroke="#94a3b8"/>
  <rect x="1" y="12" width="18" height="6" fill="#fca5a5" opacity="0.8"/></symbol>
<symbol id="cup" viewBox="0 0 24 26"><path d="M2 2 H22 L19 25 H5 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/><path d="M3.3 9 H20.7 L19.7 16 H4.3 Z" fill="#a16207"/></symbol>
<symbol id="scene" viewBox="0 0 100 100"><g clip-path="url(#t)">
  <rect width="100" height="100" fill="#9cba7c"/>
  <path d="M0 62 C30 54 60 70 100 58 V100 H0 Z" fill="#a8a29e"/>
  <g fill="#7d9b5e"><circle cx="12" cy="14" r="1.6"/><circle cx="40" cy="8" r="1.4"/><circle cx="78" cy="20" r="1.6"/><circle cx="62" cy="40" r="1.3"/><circle cx="20" cy="44" r="1.5"/><circle cx="88" cy="46" r="1.2"/></g>
  <g fill="#8f8a84"><circle cx="30" cy="80" r="1.2"/><circle cx="70" cy="88" r="1.4"/><circle cx="50" cy="72" r="1"/></g>
  <use href="#bottle" x="8" y="22" width="44" height="18" transform="rotate(-14 30 31)"/>
  <use href="#can" x="66" y="12" width="15" height="22" transform="rotate(18 73 23)"/>
  <use href="#cup" x="54" y="62" width="18" height="20" transform="rotate(-70 63 72)"/>
</g></symbol>
<filter id="tp"><feFlood flood-color="#2a78d6" flood-opacity="0.7"/><feComposite in2="SourceAlpha" operator="in"/></filter>
<filter id="tm"><feFlood flood-color="#eb6834" flood-opacity="0.7"/><feComposite in2="SourceAlpha" operator="in"/></filter>
<filter id="tq"><feFlood flood-color="#16a34a" flood-opacity="0.7"/><feComposite in2="SourceAlpha" operator="in"/></filter>
</defs>
<rect x="1" y="1" width="898" height="418" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="30" y="44" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Annotation types in this list</text>
<text x="30" y="68" font-size="14" fill="#64748b" font-weight="normal" text-anchor="start">The same kind of litter, labelled four ways. More detailed labels cost more to make, but support more tasks.</text>
<rect x="30" y="96" width="180" height="180" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
<use href="#bottle" x="60" y="162" width="120" height="48"/>
<rect x="40" y="106" width="60" height="20" rx="10" fill="#2a78d6"/><text x="70.1" y="120" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">plastic</text>
<use href="#scene" x="246" y="96" width="180" height="180"/>
<rect x="254" y="246" width="60" height="20" rx="10" fill="#2a78d6"/><text x="284.1" y="260" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">plastic</text>
<rect x="318" y="246" width="47" height="20" rx="10" fill="#eb6834"/><text x="341.5" y="260" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">metal</text>
<rect x="374" y="246" width="47" height="20" rx="10" fill="#16a34a"/><text x="397.5" y="260" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">paper</text>
<use href="#scene" x="462" y="96" width="180" height="180"/>
<rect x="471.9" y="128.7" width="84.3" height="47.2" fill="none" stroke="#2a78d6" stroke-width="2.5"/>
<rect x="471.9" y="113.7" width="56" height="15" fill="#2a78d6"/>
<text x="476.9" y="124.7" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="start">plastic</text>
<rect x="574.7" y="113.6" width="39.5" height="46.8" fill="none" stroke="#eb6834" stroke-width="2.5"/>
<rect x="574.7" y="98.6" width="43" height="15" fill="#eb6834"/>
<text x="579.7" y="109.6" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="start">metal</text>
<rect x="553.8" y="205.0" width="44.6" height="41.7" fill="none" stroke="#16a34a" stroke-width="2.5"/>
<rect x="553.8" y="190.0" width="43" height="15" fill="#16a34a"/>
<text x="558.8" y="201.0" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="start">paper</text>
<use href="#scene" x="678" y="96" width="180" height="180"/>
<g transform="translate(678 96) scale(1.8)"><use href="#bottle" x="8" y="22" width="44" height="18" transform="rotate(-14 30 31)" filter="url(#tp)"/><use href="#can" x="66" y="12" width="15" height="22" transform="rotate(18 73 23)" filter="url(#tm)"/><use href="#cup" x="54" y="62" width="18" height="20" transform="rotate(-70 63 72)" filter="url(#tq)"/></g>
<text x="30" y="304" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="start">Classification</text>
<text x="30" y="324" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">one label per image,</text>
<text x="30" y="342" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">usually one object</text>
<text x="246" y="304" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="start">Multi-label</text>
<text x="246" y="324" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">several labels per image,</text>
<text x="246" y="342" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">no locations</text>
<text x="462" y="304" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="start">Detection</text>
<text x="462" y="324" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">a box and a label</text>
<text x="462" y="342" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">for each object</text>
<text x="678" y="304" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="start">Segmentation</text>
<text x="678" y="324" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">the exact outline</text>
<text x="678" y="342" font-size="12.5" fill="#334155" font-weight="normal" text-anchor="start">of each object</text>
<text x="30" y="378" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start">Examples in this list: Trashnet and WaDaBa (classification), OpenLitterMap (multi-label),</text>
<text x="30" y="396" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="start">Trash-ICRA19 and DroneWaste (detection), TACO and ZeroWaste (segmentation).</text>
</svg>
